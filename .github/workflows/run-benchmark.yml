name: hele-shaw-cells-example CI

# Workflow is currently DISABLED to silence failure emails while the
# benchmark is being developed. To re-enable automatic runs:
#   1. Uncomment the push, pull_request, schedule, and tags blocks
#      below (replace the comment with the original `on:` entries).
#   2. Commit and push. The next push to main (or the next cron tick)
#      will run the workflow.
#
# Manual trigger (workflow_dispatch) is intentionally kept so the
# workflow can still be run from the GitHub UI's Actions tab.
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  #   tags: [ 'v*' ]
  # pull_request:
  #   branches: [ main ]
  # schedule:
  #   # Off-peak: 04:17 UTC daily
  #   - cron: '17 4 * * *'

env:
  CACHE_NUMBER: 1  # bump to reset the Docker build cache

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: Build the hele-shaw Docker image
        run: |
          cd openfoam
          docker build -t hele-shaw:${{ github.sha }} .
          echo "HELE_SHAW_IMAGE=hele-shaw:${{ github.sha }}" >> $GITHUB_ENV

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true

      - name: Create workflow env
        run: |
          mamba env create -n hs-workflow -f environment.yml
          conda run -n hs-workflow python -c "import snakemake; print('snakemake', snakemake.__version__)"

      - name: Generate workflow config
        run: |
          conda run -n hs-workflow python generate_config.py

      - name: Build the benchmark zip (regression check on the package script)
        run: |
          conda run -n hs-workflow python benchmark/build_benchmark_zip.py
          unzip -l benchmark/hele-shaw-cells-example.zip | head

      - name: Run benchmark for all configurations
        run: |
          cd openfoam
          conda run -n hs-workflow python run_benchmark.py \
            --no-snakemake \
            --docker-image $HELE_SHAW_IMAGE \
            2>&1 | tee ../results/run_benchmark.log

      - name: Summarize + plot
        run: |
          conda run -n hs-workflow python openfoam/summarize_results.py \
            results/*/solution_metrics.json \
            --output results/summary.json
          conda run -n hs-workflow python -c "import matplotlib" 2>/dev/null \
            && conda run -n hs-workflow python openfoam/summarize_metrics.py \
                 --summary-csv results/summary.csv \
                 --output-dir results \
            || echo "matplotlib not installed; skipping plot generation"

      - name: Smoke test - metrics
        run: |
          for cfg in 1 2 3; do
            metrics=results/$cfg/solution_metrics.json
            if [ -f "$metrics" ]; then
              echo "=== Smoke test: configuration $cfg ==="
              conda run -n hs-workflow python tests/compare.py \
                "$metrics" tests/baseline/metrics_baseline.json \
                --tol-json tests/baseline/metrics_tolerances.json
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hele-shaw-cells-example-results
          path: |
            results/
            benchmark/hele-shaw-cells-example.zip
            workflow_config.json

  rohub-upload:
    # Tag-triggered: uploads the freshly-produced solution_field_data.zip
    # files to the dev ROHub and saves the resulting UUIDs as an
    # artifact. Soft-skips cleanly if ROHUB_USERNAME/ROHUB_PASSWORD
    # are not set as repo secrets.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: run-benchmark
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: Download run-benchmark results
        uses: actions/download-artifact@v4
        with:
          name: hele-shaw-cells-example-results
          path: results/

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true

      - name: Create ROHub env
        run: |
          mamba env create -n hs-rohub -f openfoam/environment_rohub.yml
          # Verify the install (the rohub install can be slow due to the
          # editable git+https URL; allow it time).
          conda run -n hs-rohub python -c "import rohub; print('rohub loaded')"

      - name: Upload to ROHub
        env:
          ROHUB_USERNAME: ${{ secrets.ROHUB_USERNAME }}
          ROHUB_PASSWORD: ${{ secrets.ROHUB_PASSWORD }}
        run: |
          if [ -z "$ROHUB_USERNAME" ] || [ -z "$ROHUB_PASSWORD" ]; then
            echo "ROHUB_USERNAME/ROHUB_PASSWORD not set; skipping upload"
            echo '{"skipped": true, "reason": "secrets not configured"}' \
              > results/rohub_uuids.json
            exit 0
          fi
          conda run -n hs-rohub python openfoam/upload_to_rohub.py \
            --results-dir results/ \
            --endpoint dev \
            --output results/rohub_uuids.json

      - name: Upload ROHub UUIDs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hele-shaw-cells-example-rohub-uuids
          path: results/rohub_uuids.json

  notebook-smoke:
    # Runs the Simulation_Walkthrough.ipynb end-to-end in fast mode
    # (RUN_SIMULATION=0 — math + workflow + viz skeleton, no Docker).
    # Catches regressions in the notebook (broken code cells, missing
    # imports, etc.) on every push and PR.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
              'jupyter>=1.0' \
              'nbconvert>=7.0' \
              'nbformat>=5.9' \
              'pandas' \
              'matplotlib' \
              'jinja2'

      - name: Validate the notebook
        run: |
          python -c "import nbformat; nb = nbformat.read('notebooks/Simulation_Walkthrough.ipynb', as_version=4); nbformat.validate(nb); print('notebook is valid:', len(nb.cells), 'cells')"

      - name: Execute the notebook in fast mode (RUN_SIMULATION=0)
        env:
          RUN_SIMULATION: '0'
          CONFIGURATIONS: '1'
        run: |
          jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=300 \
              --ExecutePreprocessor.kernel_name=python3 \
              notebooks/Simulation_Walkthrough.ipynb \
              --output Simulation_Walkthrough.executed.ipynb

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hele-shaw-cells-example-walkthrough-executed
          path: Simulation_Walkthrough.executed.ipynb
